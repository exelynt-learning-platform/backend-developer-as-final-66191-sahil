spring:
  application:
    name: resource-booking-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:}
    user-password: ${SEED_USER_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Base64-encoded secret, must decode to >= 256 bits for HS256. Override in production!
    secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItZGV2LWVudmlyb25tZW50LW9ubHktcGxlYXNlLWNoYW5nZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    com.bookingsystem: DEBUG
