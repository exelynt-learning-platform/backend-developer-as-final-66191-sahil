spring:
  application:
    name: resource-booking-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

app:
  seed:
    # Disable seed data in production with SEED_ENABLED=false.
    enabled: ${SEED_ENABLED:true}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    user-password: ${SEED_USER_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # Required Base64-encoded secret; must decode to >= 256 bits for HS256.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: INFO
    com.bookingsystem: DEBUG

